<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrixx - Budoucnost webu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        h1 { font-size: 3rem; margin-bottom: 20px; text-shadow: 0 0 10px #00ff66; }
        p { font-size: 1.2rem; color: #ccc; max-width: 600px; margin-bottom: 40px; line-height: 1.6; }
        .btn {
            background: transparent;
            color: #00ff66;
            border: 2px solid #00ff66;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            border-radius: 5px;
        }
        .btn:hover { background: #00ff66; color: #050505; box-shadow: 0 0 30px #00ff66; }
        .footer { margin-top: 50px; font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>
    <h1>🌌 MATRIXX</h1>
    <p>Vítejte v nové dimenzi digitálního světa. Extrémní rychlost, dokonalý design a zážitek, který nemá konkurenci.</p>
    <a href="#" class="btn" onclick="alert('Platební brána se brzy aktivuje!')">🚀 Podpořit projekt</a>
    <div class="footer">&copy; 2026 Matrixx Project. Všechna práva vyhrazena.</div>
</body>
</html>
